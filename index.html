<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b0647" />
  <title>Happy Birthday 💜</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif}
    body{overflow-x:hidden;color:#fff;background:radial-gradient(circle at 50% 25%,#7a32a5 0,#421064 35%,#210533 72%,#12021d 100%)}
    .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.24;animation:drift 9s ease-in-out infinite alternate}.o1{width:260px;height:260px;background:#ffd84d;left:-90px;top:5%}.o2{width:340px;height:340px;background:#b768ff;right:-120px;bottom:4%;animation-delay:-4s}
    @keyframes drift{to{transform:translate(45px,55px) scale(1.12)}}
    .spark{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;text-shadow:0 0 12px currentColor}
    @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.75}85%{opacity:.55}100%{transform:translateY(-115vh) rotate(320deg);opacity:0}}
    main{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 34px;text-align:center}
    .eyebrow{font-family:system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#ffe675;font-size:.72rem;margin-bottom:10px;animation:fadeDown .9s ease both}
    h1{max-width:1000px;margin:0 0 22px;font-size:clamp(1.65rem,5vw,3.8rem);line-height:1.08;color:#fff;text-shadow:0 0 12px rgba(255,218,74,.25),0 3px 20px rgba(0,0,0,.35);animation:fadeDown 1s .12s ease both}
    h1 span{color:#ffe25d}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
    .frame{width:min(91vw,520px);height:min(67svh,690px);min-height:430px;position:relative;border-radius:28px;padding:5px;background:linear-gradient(135deg,#ffd84d,#9f55dc,#ffe679);box-shadow:0 22px 70px rgba(0,0,0,.42),0 0 35px rgba(255,220,80,.16);animation:pop 1s .2s cubic-bezier(.2,.9,.2,1) both}
    @keyframes pop{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
    .photo-box{position:relative;width:100%;height:100%;border-radius:23px;overflow:hidden;background:#160321}
    .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transform:scale(1.035);transition:opacity 1s ease,transform 5.5s ease;background:#160321}
    .slide.active{opacity:1;transform:scale(1)}
    button{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:46px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(36,4,55,.56);backdrop-filter:blur(7px);color:#ffe25d;font-size:28px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:.2s}button:hover{background:#ffe25d;color:#35104b;transform:translateY(-50%) scale(1.08)}
    .prev{left:12px}.next{right:12px}
    .counter{position:absolute;right:14px;bottom:13px;z-index:5;font:600 12px system-ui,sans-serif;background:rgba(25,2,40,.6);padding:7px 10px;border-radius:999px;color:#ffe97c;backdrop-filter:blur(8px)}
    .dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:17px}.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);border:0;padding:0;position:static;transform:none;cursor:pointer;transition:.25s}.dot.active{width:24px;border-radius:10px;background:#ffe25d;box-shadow:0 0 12px rgba(255,226,93,.7)}
    .hint{font:500 .76rem system-ui,sans-serif;color:#d9c7e7;margin-top:10px;opacity:.8}
    @media(max-width:600px){main{justify-content:flex-start;padding-top:max(28px,env(safe-area-inset-top))}.eyebrow{margin-top:4px}h1{margin-bottom:18px}.frame{height:66svh;min-height:390px;border-radius:23px}.photo-box{border-radius:19px}button{width:40px;height:40px;font-size:24px}.prev{left:8px}.next{right:8px}}
    @media(max-height:700px){.eyebrow{display:none}h1{font-size:clamp(1.4rem,4vw,2.5rem);margin-bottom:12px}.frame{height:70svh;min-height:330px}.hint{display:none}.dots{margin-top:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="bg" id="bg"><div class="orb o1"></div><div class="orb o2"></div></div>
  <main>
    <div class="eyebrow">a little celebration for you</div>
    <h1>HAPPY BIRTHDAY TO MY<br><span>PLATONIC SOULMATE💜</span></h1>
    <section class="frame" aria-label="Birthday photo slideshow">
      <div class="photo-box" id="photoBox">
        <img class="slide active" src="images/WhatsApp Image 2026-09-28 at 15.17.35 (2).jpeg" alt="Birthday memory 1">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.35 (3).jpeg" alt="Birthday memory 2">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.34 (1).jpeg" alt="Birthday memory 3">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.36 (3).jpeg" alt="Birthday memory 4">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.35 (1).jpeg" alt="Birthday memory 5">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.36 (1).jpeg" alt="Birthday memory 6">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.35.jpeg" alt="Birthday memory 7">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.36.jpeg" alt="Birthday memory 8">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.36 (2).jpeg" alt="Birthday memory 9">
        <img class="slide" src="images/WhatsApp Image 2026-09-28 at 15.17.34.jpeg" alt="Birthday memory 10">
        <button class="prev" aria-label="Previous photo">‹</button><button class="next" aria-label="Next photo">›</button>
        <div class="counter"><span id="current">1</span> / 10</div>
      </div>
    </section>
    <div class="dots" id="dots" aria-label="Choose photo"></div>
    <div class="hint">swipe or use the arrows ✨</div>
  </main>
  <script>
    const slides=[...document.querySelectorAll('.slide')], dots=document.getElementById('dots'), current=document.getElementById('current'), box=document.getElementById('photoBox');
    let index=0,timer,touchStart=0;
    slides.forEach((_,i)=>{const d=document.createElement('button');d.className='dot'+(i===0?' active':'');d.setAttribute('aria-label','Photo '+(i+1));d.onclick=()=>show(i,true);dots.appendChild(d)});
    const dotEls=[...dots.children];
    function show(i,manual=false){slides[index].classList.remove('active');dotEls[index].classList.remove('active');index=(i+slides.length)%slides.length;slides[index].classList.add('active');dotEls[index].classList.add('active');current.textContent=index+1;if(manual)restart()}
    function restart(){clearInterval(timer);timer=setInterval(()=>show(index+1),4500)}
    document.querySelector('.prev').onclick=()=>show(index-1,true);document.querySelector('.next').onclick=()=>show(index+1,true);
    box.addEventListener('touchstart',e=>touchStart=e.changedTouches[0].clientX,{passive:true});box.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStart;if(Math.abs(dx)>45)show(index+(dx<0?1:-1),true)},{passive:true});
    document.addEventListener('visibilitychange',()=>document.hidden?clearInterval(timer):restart());restart();
    const bg=document.getElementById('bg'), icons=['💜','✨','💛','✦'];
    for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[i%icons.length];s.style.left=Math.random()*100+'%';s.style.fontSize=(10+Math.random()*16)+'px';s.style.animationDuration=(7+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*14)+'s';bg.appendChild(s)}
  </script>
</body>
</html>
